<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <script>
        async function testApi() {
            try {
                const response = await fetch('http://localhost:8001/api/matches');
                const data = await response.json();
                document.getElementById('result').innerText = JSON.stringify(data, null, 2);
                document.getElementById('status').innerText = 'Success!';
                document.getElementById('status').style.color = 'green';
            } catch (error) {
                document.getElementById('result').innerText = error.toString();
                document.getElementById('status').innerText = 'Failed!';
                document.getElementById('status').style.color = 'red';
            }
        }
    </script>
</head>
<body>
    <h1>API Connection Test</h1>
    <button onclick="testApi()">Test Backend API</button>
    <div>
        <h3>Status: <span id="status">Not tested</span></h3>
        <pre id="result">Click the button to test</pre>
    </div>
</body>
</html>
